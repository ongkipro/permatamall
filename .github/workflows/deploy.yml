name: Deploy Permata Mall to Cloudflare Workers

# Deploys through `npm run deploy`, so the preflight (scripts/preflight-deploy.ts)
# runs here exactly as on a laptop: real resource ids, a tree that is not behind
# origin/main, every applied D1 migration bundled, every live native landing
# page registered. A bare `wrangler deploy` skips all four.
#
# The token needs D1 read on this account: the preflight only warns when it
# cannot read production D1, so the strict step below turns that warning into
# a failure before anything ships.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time, in push order; a newer push never races an older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Worker
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The preflight compares HEAD with its upstream; a re-run of an older
      # commit is then refused as behind origin/main instead of reverting it.
      - name: Track origin/main
        run: |
          git checkout -B main "$GITHUB_SHA"
          git branch --set-upstream-to=origin/main main

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run check

      - name: Run Tests
        run: npm test

      - name: Preflight (strict)
        run: |
          npm run preflight:deploy 2>&1 | tee preflight.log
          if grep -q 'could not' preflight.log; then
            echo "::error::Preflight could not complete every check (see above); refusing to deploy."
            exit 1
          fi

      - name: Deploy Worker to Cloudflare
        run: npm run deploy
